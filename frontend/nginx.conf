server {
    listen 80;
    server_name localhost;

    # Servir archivos estáticos del frontend con soporte SPA
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Proxy inverso hacia el backend FastAPI
    # Sin trailing slash para preservar el prefijo completo /api/v1/...
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-User-Id $http_x_user_id;
        proxy_set_header Idempotency-Key $http_idempotency_key;
    }
}
