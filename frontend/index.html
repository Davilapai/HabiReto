<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabiReto</title>
  
  <!-- Tipografía Editorial Manrope (Fintech Precision) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Sistema de Estilos Fintech -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor General con Sidebar y Área de Contenido -->
  <div class="app-shell">

    <!-- Sidebar Izquierdo Permanente -->
    <aside class="bank-sidebar" id="appSidebar" aria-label="Menú Principal">
      <div>
        <!-- Logo Institucional HabiReto -->
        <div class="sidebar-brand">
          <div class="sidebar-logo-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"/>
            </svg>
          </div>
          <div class="sidebar-brand-name">HabiReto</div>
        </div>

        <!-- Menú de Navegación del Sistema -->
        <nav class="sidebar-nav">
          <button type="button" id="sideNavInicio" class="sidebar-nav-item active" data-target="dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Inicio</span>
          </button>

          <button type="button" id="sideNavCows" class="sidebar-nav-item" data-target="cows">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            <span>Vaquitas</span>
          </button>

          <button type="button" id="sideNavHistory" class="sidebar-nav-item" data-target="history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>Movimientos</span>
          </button>

          <button type="button" id="sideNavSettings" class="sidebar-nav-item" data-target="settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Configuración</span>
          </button>

          <button type="button" id="sideNavHelp" class="sidebar-nav-item" data-target="help">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Ayuda</span>
          </button>
        </nav>
      </div>

    </aside>

    <!-- Área Principal de la Aplicación -->
    <div class="app-main-area">

      <!-- Barra de Navegación Superior -->
      <header class="app-header">
        <div class="app-header-container">
          
          <!-- Título Dinámico de la Sección -->
          <h1 id="currentViewTitle" class="app-header-title">Inicio</h1>

          <!-- Selector de Identidad y Gestión de Personas -->
          <div id="identitySelectorRoot"></div>

        </div>
      </header>

      <!-- Contenedor de Vistas -->
      <main class="app-content">

        <!-- Sección 1: Panel Central (Saldo + Recarga + Transferencia + Resumen) -->
        <section id="dashboardSection" role="tabpanel">
          <div id="dashboardRoot"></div>
        </section>

        <!-- Sección 2: Módulo de Vacas y Fondos Colaborativos -->
        <section id="cowsSection" role="tabpanel" style="display:none;">
          <div id="cowsRoot"></div>
          <div id="privacyInspectorRoot"></div>
        </section>

        <!-- Sección 3: Extracto de Movimientos Dedicado (Libro Mayor) -->
        <section id="historySection" role="tabpanel" style="display:none;">
          <div id="historyRoot"></div>
        </section>

        <!-- Sección 4: Configuración del Sistema -->
        <section id="settingsSection" role="tabpanel" style="display:none;">
          <div id="settingsRoot"></div>
        </section>

        <!-- Sección 5: Ayuda y Guía del Reto -->
        <section id="helpSection" role="tabpanel" style="display:none;">
          <div id="helpRoot"></div>
        </section>

      </main>

    </div>

  </div>

  <!-- Contenedor Global de Toasts -->
  <div id="toast-container"></div>

  <!-- Controlador Principal SPA -->
  <script type="module" src="app.js"></script>
</body>
</html>
