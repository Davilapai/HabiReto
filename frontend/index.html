<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HabiReto — Banca Digital y Fondos Colaborativos</title>
  
  <!-- Tipografía Editorial Inter (Swiss Typographic Style) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Sistema de Estilos Modern Digital Banking -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Contenedor General con Sidebar y Área de Contenido -->
  <div class="app-shell">

    <!-- Sidebar Izquierdo Permanente -->
    <aside class="bank-sidebar" id="appSidebar" aria-label="Menú Principal">
      <div>
        <!-- Logo Institucional HabiReto Blanco -->
        <div class="sidebar-brand">
          <svg class="sidebar-logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 21h18M3 10h18M5 10v11M19 10v11M9 10v11M15 10v11M12 2L2 7h20L12 2z"/>
          </svg>
          <span class="sidebar-brand-name">HabiReto</span>
        </div>

        <!-- Menú de Navegación del Sistema -->
        <nav class="sidebar-nav" role="navigation">
          <button type="button" id="sideNavInicio" class="sidebar-nav-item active" data-target="dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
              <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Inicio</span>
          </button>

          <button type="button" id="sideNavTransfer" class="sidebar-nav-item" data-target="transfer">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
            </svg>
            <span>Transferencias</span>
          </button>

          <button type="button" id="sideNavCows" class="sidebar-nav-item" data-target="cows">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/>
              <line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            <span>Fondos / Vacas</span>
          </button>

          <button type="button" id="sideNavHistory" class="sidebar-nav-item" data-target="history">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            <span>Movimientos</span>
          </button>

          <button type="button" id="sideNavSettings" class="sidebar-nav-item" data-target="settings">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
            <span>Configuración</span>
          </button>

          <button type="button" id="sideNavHelp" class="sidebar-nav-item" data-target="help">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"/>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
              <line x1="12" y1="17" x2="12.01" y2="17"/>
            </svg>
            <span>Ayuda</span>
          </button>
        </nav>
      </div>

      <!-- Tarjeta Inferior de Inspiración Financiera -->
      <div class="sidebar-bottom-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div style="width:28px;height:28px;border-radius:6px;background:rgba(255,255,255,0.12);display:flex;align-items:center;justify-content:center;color:#60A5FA;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="20" x2="18" y2="10"/>
              <line x1="12" y1="20" x2="12" y2="4"/>
              <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
          </div>
          <span style="font-size:12px;font-weight:600;color:#FFFFFF;line-height:1.2;">
            Tu futuro financiero, en tus manos
          </span>
        </div>
        <p style="font-size:11px;color:#94A3B8;margin:0;line-height:1.35;">
          Partida doble auditada en tiempo real con aislamiento financiero.
        </p>
      </div>
    </aside>

    <!-- Área Principal de la Aplicación -->
    <div class="app-main-area">

      <!-- Barra de Navegación Superior -->
      <header style="background:#FFFFFF;border-bottom:1px solid #E5EAF0;position:sticky;top:0;z-index:20;box-shadow:0 1px 2px rgba(16,24,40,0.03);">
        <div style="max-width:1200px;margin:0 auto;padding:12px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
          
          <!-- Marca en Navbar Superior -->
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:34px;height:34px;background:#173B63;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#FFFFFF;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
                <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
              </svg>
            </div>
            <span style="font-size:17px;font-weight:700;color:#111827;letter-spacing:-0.4px;">HabiReto</span>
          </div>

          <!-- Selector de Identidad y Gestión de Personas -->
          <div id="identitySelectorRoot"></div>

        </div>
      </header>

      <!-- Contenedor de Vistas -->
      <main style="max-width:1200px;width:100%;margin:0 auto;padding:24px;display:flex;flex-direction:column;gap:20px;flex:1;">

        <!-- Selector de Pestañas Superiores (Tabs) -->
        <nav style="display:flex;border-bottom:1px solid #E5EAF0;gap:28px;" role="tablist" aria-label="Secciones de la banca digital">
          <button type="button" id="tabDashboard" role="tab" aria-selected="true" style="background:none;border:none;border-bottom:2px solid #173B63;color:#173B63;font-size:14px;font-weight:600;padding:10px 4px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 150ms;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/>
            </svg>
            Panel Central
          </button>

          <button type="button" id="tabCows" role="tab" aria-selected="false" style="background:none;border:none;border-bottom:2px solid transparent;color:#667085;font-size:14px;font-weight:500;padding:10px 4px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 150ms;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/>
            </svg>
            Vacas
          </button>

          <button type="button" id="tabHistory" role="tab" aria-selected="false" style="background:none;border:none;border-bottom:2px solid transparent;color:#667085;font-size:14px;font-weight:500;padding:10px 4px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all 150ms;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="8" y1="6" x2="21" y2="6"/>
              <line x1="8" y1="12" x2="21" y2="12"/>
              <line x1="8" y1="18" x2="21" y2="18"/>
              <line x1="3" y1="6" x2="3.01" y2="6"/>
              <line x1="3" y1="12" x2="3.01" y2="12"/>
              <line x1="3" y1="18" x2="3.01" y2="18"/>
            </svg>
            Movimientos
          </button>
        </nav>

        <!-- Sección 1: Panel Central (Únicamente Saldo Disponible + Recarga Rápida + Transferencia) -->
        <section id="dashboardSection" role="tabpanel" aria-labelledby="tabDashboard">
          <div id="dashboardRoot"></div>
        </section>

        <!-- Sección 2: Módulo de Vacas y Fondos Colaborativos -->
        <section id="cowsSection" role="tabpanel" aria-labelledby="tabCows" style="display:none;">
          <div id="cowsRoot"></div>
          <div id="privacyInspectorRoot"></div>
        </section>

        <!-- Sección 3: Extracto de Movimientos Dedicado (Libro Mayor) -->
        <section id="historySection" role="tabpanel" aria-labelledby="tabHistory" style="display:none;">
          <div id="historyRoot"></div>
        </section>

        <!-- Sección 4: Configuración del Sistema -->
        <section id="settingsSection" role="tabpanel" style="display:none;">
          <div id="settingsRoot"></div>
        </section>

        <!-- Sección 5: Ayuda y Guía del Reto -->
        <section id="helpSection" role="tabpanel" style="display:none;">
          <div id="helpRoot"></div>
        </section>

      </main>

      <!-- Pie de Página Institucional -->
      <footer style="max-width:1200px;width:100%;margin:20px auto 20px auto;padding:16px 24px;border-top:1px solid #E5EAF0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#98A2B3;flex-wrap:wrap;gap:8px;">
        <span>HabiReto Core v1.0 — Transacciones respaldadas por Libro Mayor de Partida Doble en PostgreSQL.</span>
        <span>Privacidad Zero-Trust autorizada en frontera mediante X-User-Id.</span>
      </footer>

    </div>

  </div>

  <!-- Contenedor Global de Toasts -->
  <div id="toast-container"></div>

  <!-- Controlador Principal SPA -->
  <script type="module" src="app.js"></script>
</body>
</html>
