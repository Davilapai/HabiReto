<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vaqui — HabiReto Fintech Social</title>

  <!-- Tipografías del Sistema Terra: Outfit, Nunito Sans y JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,300..900;1,6..12,300..900&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Iconografía Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

  <!-- Utilidades Tailwind CSS con configuración de paleta Terra -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            terra: {
              primary: '#4a7c59',
              primaryHover: '#3d6749',
              primaryDark: '#20462c',
              primaryLight: '#e8f1eb',
              primarySoft: '#d4e5d9',
              bg: '#f9f8f5',
              surface: '#ffffff',
              container: '#f5f1ea',
              containerLow: '#fbf9f6',
              border: '#eae5db',
              textMain: '#191c1d',
              textMuted: '#5d645e',
              textSubtle: '#788179',
              debit: '#b83230',
              debitBg: '#fdf2f2',
              creditBg: '#f0f7f2',
              amber: '#8e5b22',
              amberBg: '#fdf5eb',
              amberBorder: '#fae2c8',
            }
          },
          fontFamily: {
            sans: ['"Nunito Sans"', 'sans-serif'],
            heading: ['"Outfit"', 'sans-serif'],
            headline: ['"Outfit"', 'sans-serif'],
            display: ['"Outfit"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          }
        }
      }
    };
  </script>

  <!-- Sistema de Estilos Terra / Vaqui -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-screen bg-[#f9f8f5] text-[#191c1d] antialiased selection:bg-[#4a7c59] selection:text-white">

  <!-- =====================================================================
       VISTA 0: BIENVENIDA Y ACCESO ("Esto es Vaqui")
       Se muestra al cerrar sesión o mediante conmutación explícita.
       ===================================================================== -->
  <div id="welcomeSection" class="hidden"></div>

  <!-- =====================================================================
       APP SHELL PRINCIPAL (Sidebar Fijo + Header + Área de Vistas)
       ===================================================================== -->
  <div id="appShell" class="min-h-screen flex bg-[#f9f8f5]">

    <!-- Sidebar Izquierdo Fijo (w-64) -->
    <aside class="w-64 bg-white border-r border-[#eae5db] flex flex-col justify-between fixed top-0 bottom-0 left-0 z-30 select-none shadow-[1px_0_12px_rgba(0,0,0,0.02)]" id="appSidebar" aria-label="Menú Principal">
      <div class="flex flex-col">
        <!-- Logo e Identidad Vaqui -->
        <div class="h-20 flex items-center px-6 border-b border-[#eae5db]/60">
          <button type="button" id="brandHomeBtn" class="flex items-center gap-3 group text-left bg-transparent border-0 cursor-pointer p-0">
            <div class="w-11 h-11 rounded-2xl bg-[#4a7c59] flex items-center justify-center text-white shadow-sm transition-transform duration-200 group-hover:scale-105">
              <span class="material-symbols-outlined fill text-2xl">savings</span>
            </div>
            <div class="flex flex-col">
              <div class="flex items-baseline">
                <span class="font-heading font-extrabold text-2xl tracking-tight text-[#191c1d]">Va</span><span class="font-heading font-extrabold text-2xl tracking-tight text-[#4a7c59]">qui</span>
              </div>
            </div>
          </button>
        </div>

        <!-- Enlaces de Navegación -->
        <nav class="p-4 space-y-1.5 mt-2" aria-label="Secciones principales">
          <button type="button" id="sideNavInicio" class="vaqui-nav-item active" data-target="dashboard">
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined nav-icon text-[22px]">grid_view</span>
              <span>Inicio</span>
            </div>
            <span class="nav-dot"></span>
          </button>

          <button type="button" id="sideNavCows" class="vaqui-nav-item" data-target="cows">
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined nav-icon text-[22px]">savings</span>
              <span>Vaquitas</span>
            </div>
            <span id="sidebarCowsBadge" class="px-2 py-0.5 rounded-full bg-[#e8f1eb] text-[#20462c] text-xs font-bold tabular-nums">0</span>
          </button>

          <button type="button" id="sideNavHistory" class="vaqui-nav-item" data-target="history">
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined nav-icon text-[22px]">receipt_long</span>
              <span>Movimientos</span>
            </div>
            <span class="nav-dot"></span>
          </button>

          <button type="button" id="sideNavSettings" class="vaqui-nav-item" data-target="settings">
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined nav-icon text-[22px]">tune</span>
              <span>Configuración</span>
            </div>
            <span class="nav-dot"></span>
          </button>

          <button type="button" id="sideNavHelp" class="vaqui-nav-item" data-target="help">
            <div class="flex items-center gap-3.5">
              <span class="material-symbols-outlined nav-icon text-[22px]">help_outline</span>
              <span>Ayuda</span>
            </div>
            <span class="nav-dot"></span>
          </button>
        </nav>
      </div>

      <!-- Botón Inferior: Cerrar sesión (lleva a la pantalla de Bienvenida) -->
      <div class="p-4 border-t border-[#eae5db]/60 bg-white">
        <button type="button" id="btnLogoutWelcome" class="w-full flex items-center justify-between px-4 py-3 rounded-xl bg-[#f5f1ea] hover:bg-[#eae5db] text-[#5d645e] hover:text-[#191c1d] font-semibold text-sm transition-all group cursor-pointer border-0">
          <div class="flex items-center gap-3">
            <span class="material-symbols-outlined text-xl transition-transform group-hover:-translate-x-0.5">logout</span>
            <span>Cerrar sesión</span>
          </div>
          <span class="material-symbols-outlined text-lg text-[#788179] transition-transform group-hover:translate-x-0.5">chevron_right</span>
        </button>
      </div>
    </aside>

    <!-- Área Principal (ml-64) -->
    <div class="ml-64 flex-1 flex flex-col min-w-0 min-h-screen">

      <!-- Cabecera Superior Fija (h-16) -->
      <header class="h-16 bg-white/95 backdrop-blur-md border-b border-[#eae5db] px-8 flex items-center justify-between sticky top-0 z-20">
        <div class="flex items-center gap-3">
          <h1 id="currentViewTitle" class="font-heading font-extrabold text-xl text-[#191c1d] tracking-tight m-0">Panel Principal</h1>
          <span id="currentViewBadge" class="hidden text-xs bg-[#f5f1ea] px-2.5 py-0.5 rounded-full font-semibold text-[#5d645e] border border-[#eae5db]"></span>
        </div>

        <!-- Selector de Identidad y Acción Rápida de Registro -->
        <div id="identitySelectorRoot"></div>
      </header>

      <!-- Contenedor Principal de Vistas -->
      <main class="p-8 max-w-7xl w-full mx-auto flex-1">

        <!-- Sección 1: Inicio (Saldo + Recargar / Transferir) -->
        <section id="dashboardSection" role="tabpanel">
          <div id="dashboardRoot"></div>
        </section>

        <!-- Sección 2: Vaquitas (Panel Principal + Nueva Vaquita + Inspector Zero-Trust) -->
        <section id="cowsSection" role="tabpanel" style="display:none;" class="space-y-8">
          <div id="cowsRoot"></div>
          <div id="privacyInspectorRoot"></div>
        </section>

        <!-- Sección 3: Movimientos (Libro Mayor de Partida Doble) -->
        <section id="historySection" role="tabpanel" style="display:none;">
          <div id="historyRoot"></div>
        </section>

        <!-- Sección 4: Configuración y Selector de Cuenta -->
        <section id="settingsSection" role="tabpanel" style="display:none;">
          <div id="settingsRoot"></div>
        </section>

        <!-- Sección 5: Ayuda y Preguntas Frecuentes -->
        <section id="helpSection" role="tabpanel" style="display:none;">
          <div id="helpRoot"></div>
        </section>

      </main>

    </div>

  </div>

  <!-- Contenedor Global de Toasts -->
  <div id="toast-container"></div>

  <!-- Controlador Principal SPA -->
  <script type="module" src="app.js"></script>
</body>
</html>
